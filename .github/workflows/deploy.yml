# Publishes the static build to alderoberge.com/chess (Cloudflare Worker, see wrangler.jsonc).
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with Workers Scripts: Edit on the alderoberge.com account
#   CLOUDFLARE_ACCOUNT_ID  e2a5f5d2bbf981db61184e9e31ff3522

name: Deploy /chess

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "bridge/**"
      - "icon-options/**"
      - "*.bat"
      - "*.ps1"
      - "scripts/split-to-new-repo.sh"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: deploy-chess
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the Cloudflare secrets exist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets, then re-run this job."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run setup:stockfish
      - run: npm run build
      - run: npx --yes wrangler@4 deploy
