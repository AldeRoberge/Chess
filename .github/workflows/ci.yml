name: ci
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "bridge/**"
      - "icon-options/**"
      - "*.bat"
      - "*.ps1"
      - "scripts/split-to-new-repo.sh"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "bridge/**"
      - "icon-options/**"
      - "*.bat"
      - "*.ps1"
      - "scripts/split-to-new-repo.sh"
      - "LICENSE"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run check
