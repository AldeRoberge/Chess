<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#060f1a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Chess XP</title>
  <link rel="icon" type="image/svg+xml" href="/knight.svg" />
  <!-- iOS "Add to Home Screen" ignores the SVG favicon and draws a letter tile instead; it needs this opaque 180x180 PNG (full-bleed, iOS rounds the corners). Same knight artwork as knight.svg. -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Chess XP" />
  <!-- Painted before any script loads, so reopening the app never shows a blank screen. The app replaces #app's contents when it starts. -->
  <style>
    html,body{margin:0;background:#02060d}
    @media (prefers-color-scheme:light){html,body{background:#eef3f9}#boot{color:#1b2a3d}#boot i{background:#d3deea}}
    #boot{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:20px;color:#d7e6f8;font:600 22px/1 "Chakra Petch",system-ui,sans-serif;letter-spacing:.08em}
    #boot img{width:112px;height:112px;border-radius:26px;animation:boot-in .5s ease-out both}
    #boot i{position:relative;overflow:hidden;width:112px;height:3px;border-radius:2px;background:#16283d}
    #boot i::after{content:"";position:absolute;inset:0;width:40%;border-radius:2px;background:#4ea3ff;animation:boot-bar 1.1s ease-in-out infinite}
    #boot p{margin:0;font:500 14px/1.3 system-ui,sans-serif;letter-spacing:0;opacity:.8;text-align:center}
    @keyframes boot-in{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
    @keyframes boot-bar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
    @media (prefers-reduced-motion:reduce){#boot img,#boot i::after{animation:none}}
  </style>
</head>
<body>
  <div id="app"><div id="boot" role="status" aria-label="Loading Chess XP"><img src="/apple-touch-icon.png" alt="" width="112" height="112" /><span>Chess XP</span><i></i></div></div>
  <script>setTimeout(function(){var b=document.getElementById("boot");if(b)b.insertAdjacentHTML("beforeend",'<p>Still loading. Check your connection, or <a href="" style="color:inherit">reload</a>.</p>')},15000)</script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
